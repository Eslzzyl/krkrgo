name: Build FFmpeg sidecar

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FFMPEG_VERSION: 9.0.2
  FFMPEG_SOURCE_SHA256: 8c3850283eb25fa026482078a04051e0be17347b09ef81a0849bec15a96e002e
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content
  CCACHE_MAXSIZE: 1G

concurrency:
  group: ffmpeg-sidecar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-26.04
            shell: bash
            ffmpeg_os: linux
            ffmpeg_arch: x86_64
            cc: gcc
            cross_prefix: none
            install: ccache gcc make nasm pkg-config
          - name: linux-aarch64
            runner: ubuntu-26.04-arm
            shell: bash
            ffmpeg_os: linux
            ffmpeg_arch: aarch64
            cc: aarch64-linux-gnu-gcc
            cross_prefix: aarch64-linux-gnu-
            install: ccache gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu make nasm pkg-config
          - name: macos-arm64
            runner: macos-26
            shell: bash
            ffmpeg_os: macos
            ffmpeg_arch: arm64
            cc: clang
            cross_prefix: none
            install: ccache nasm pkg-config
          - name: macos-x86_64
            runner: macos-26-intel
            shell: bash
            ffmpeg_os: macos
            ffmpeg_arch: x86_64
            cc: clang
            cross_prefix: none
            install: ccache nasm pkg-config
          - name: windows-x86_64
            runner: windows-2025
            shell: msys2 {0}
            ffmpeg_os: windows
            ffmpeg_arch: x86_64
            cc: x86_64-w64-mingw32-gcc
            ar: /ucrt64/bin/ar
            nm: /ucrt64/bin/nm
            msystem: UCRT64
            install: base-devel ccache make p7zip mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-binutils mingw-w64-ucrt-x86_64-nasm
          - name: windows-arm64
            runner: windows-2025
            shell: msys2 {0}
            ffmpeg_os: windows
            ffmpeg_arch: aarch64
            cc: clang
            host_cc: clang
            ar: /clang64/bin/ar
            nm: /clang64/bin/nm
            objdump: /clang64/bin/llvm-objdump
            windres: llvm-windres -F aarch64-w64-mingw32
            cross_prefix: aarch64-w64-windows-gnu-
            enable_cross_compile: '1'
            sysroot: /clangarm64
            msystem: CLANG64
            install: base-devel ccache make p7zip mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-llvm-tools mingw-w64-clang-x86_64-nasm mingw-w64-clang-aarch64-headers mingw-w64-clang-aarch64-crt mingw-w64-clang-aarch64-libwinpthread mingw-w64-clang-aarch64-winpthreads mingw-w64-clang-aarch64-compiler-rt mingw-w64-clang-aarch64-libunwind

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v7
      - name: Restore compiler cache
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ffmpeg-ccache-${{ matrix.name }}-${{ env.FFMPEG_VERSION }}-${{ hashFiles('scripts/build-ffmpeg.sh', '.github/workflows/build-ffmpeg.yml') }}
          restore-keys: |
            ffmpeg-ccache-${{ matrix.name }}-${{ env.FFMPEG_VERSION }}-
      - name: Install Linux tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.install }}

      - name: Install macOS tools
        if: runner.os == 'macOS'
        run: brew install ${{ matrix.install }}

      - name: Install Windows toolchain
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: ${{ matrix.install }}
      - name: Link ARM64 compiler runtime
        if: matrix.name == 'windows-arm64'
        run: |
          resource_dir=$(clang -print-resource-dir)
          runtime_dir="$resource_dir/lib/aarch64-w64-windows-gnu"
          mkdir -p "$runtime_dir"
          ln -sf /clangarm64/lib/clang/23/lib/windows/libclang_rt.builtins-aarch64.a "$runtime_dir/libclang_rt.builtins.a"
          test -f "$runtime_dir/libclang_rt.builtins.a"
      - name: Link ARM64 import-library tool
        if: matrix.name == 'windows-arm64'
        run: |
          test -x /clang64/bin/dlltool.exe
          ln -sf /clang64/bin/dlltool.exe /usr/bin/aarch64-w64-windows-gnu-dlltool

      - name: Fetch and verify FFmpeg source
        run: |
          archive=ffmpeg.tar.xz
          curl -fL --retry 3 -o "$archive" "https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz"
          actual_sha256=$(sha256sum "$archive" 2>/dev/null | awk '{print $1}' || true)
          if [[ -z "$actual_sha256" ]]; then
            actual_sha256=$(shasum -a 256 "$archive" | awk '{print $1}')
          fi
          test "$actual_sha256" = "$FFMPEG_SOURCE_SHA256"
          mkdir ffmpeg-source
          tar -xJf "$archive" --strip-components=1 -C ffmpeg-source
          test "$(tr -d '\r\n' < ffmpeg-source/RELEASE)" = "$FFMPEG_VERSION"

      - name: Build FFmpeg sidecar
        env:
          OS: ${{ matrix.ffmpeg_os }}
          ARCH: ${{ matrix.ffmpeg_arch }}
          CC: ${{ matrix.cc }}
          AR: ${{ matrix.ar || '' }}
          NM: ${{ matrix.nm || '' }}
          OBJDUMP: ${{ matrix.objdump || '' }}
          HOST_CC: ${{ matrix.host_cc || '' }}
          WINDRES: ${{ matrix.windres || '' }}
          CCACHE: ccache
          CROSS_PREFIX: ${{ matrix.cross_prefix }}
          SYSROOT: ${{ matrix.sysroot || '' }}
          ENABLE_CROSS_COMPILE: ${{ matrix.enable_cross_compile || '0' }}
          FFMPEG_SOURCE_DIR: ${{ github.workspace }}/ffmpeg-source
          PREFIX: ${{ github.workspace }}/stage/ffmpeg-${{ matrix.name }}
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            export CCACHE_BASEDIR="$PWD"
            export CCACHE_DIR="$PWD/.ccache"
          fi
          scripts/build-ffmpeg.sh
      - name: Show configure log on failure
        if: failure()
        env:
          BUILD_DIR: ${{ github.workspace }}/.build/ffmpeg-${{ matrix.name }}
        run: |
          if [[ -f "$BUILD_DIR/ffbuild/config.log" ]]; then
            cat "$BUILD_DIR/ffbuild/config.log"
          else
            echo "FFmpeg configure log is unavailable: $BUILD_DIR/ffbuild/config.log"
          fi

      - name: Check sidecar layout
        env:
          PREFIX: ${{ github.workspace }}/stage/ffmpeg-${{ matrix.name }}
          FF_PLATFORM: ${{ matrix.ffmpeg_os }}
        run: |
          test -f "$PREFIX/LICENSES/FFmpeg/COPYING.LGPLv2.1"
          test -f "$PREFIX/LICENSES/FFmpeg/source-version.txt"
          test -f "$PREFIX/LICENSES/FFmpeg/configure.txt"
          test -d "$PREFIX/lib/ffmpeg"
          case "$FF_PLATFORM" in
            linux)
              for lib in libavutil.so.61 libavcodec.so.63 libavformat.so.63 libswscale.so.10; do test -f "$PREFIX/lib/ffmpeg/$lib"; done
              ;;
            macos)
              for lib in libavutil.61.dylib libavcodec.63.dylib libavformat.63.dylib libswscale.10.dylib; do test -f "$PREFIX/lib/ffmpeg/$lib"; done
              ;;
            windows)
              for lib in avutil-61.dll avcodec-63.dll avformat-63.dll swscale-10.dll; do test -f "$PREFIX/lib/ffmpeg/$lib"; done
              ;;
          esac
          test ! -d "$PREFIX/bin"
          test ! -d "$PREFIX/sbin"


      - name: Upload sidecar
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-${{ matrix.name }}
          path: ${{ github.workspace }}/stage/ffmpeg-${{ matrix.name }}
          compression-level: 6
          if-no-files-found: error
  publish-release:
    name: Publish FFmpeg sidecar release
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: write
    concurrency:
      group: ffmpeg-sidecar-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download sidecar artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-inputs
      - name: Determine sidecar release tag
        id: version
        shell: bash
        run: |
          set -Eeuo pipefail
          tag_prefix="ffmpeg-sidecar-v${FFMPEG_VERSION}-r"
          latest_revision=$(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/tags?per_page=100" \
              --jq '.[].name' |
              awk -v prefix="$tag_prefix" '
                index($0, prefix) == 1 {
                  revision = substr($0, length(prefix) + 1)
                  if (revision ~ /^[0-9]+$/ && revision + 0 > max) {
                    max = revision + 0
                  }
                }
                END { print max + 0 }
              '
          )
          release_tag="${tag_prefix}$((latest_revision + 1))"
          printf 'release_tag=%s\n' "$release_tag" >> "$GITHUB_OUTPUT"
          printf 'Sidecar release tag: %s\n' "$release_tag"
      - name: Package release assets
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          set -Eeuo pipefail
          mkdir -p release-assets
          platforms=(
            linux-x86_64
            linux-aarch64
            macos-x86_64
            macos-arm64
            windows-x86_64
            windows-arm64
          )
          for platform in "${platforms[@]}"; do
            archive_dir="ffmpeg-$platform"
            source_dir="release-inputs/$archive_dir"
            test -d "$source_dir"
            case "$platform" in
              windows-*)
                (cd release-inputs && zip -qr "$GITHUB_WORKSPACE/release-assets/$RELEASE_TAG-$platform.zip" "$archive_dir")
                ;;
              *)
                tar -C release-inputs -czf "release-assets/$RELEASE_TAG-$platform.tar.gz" "$archive_dir"
                ;;
            esac
          done
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort
      - name: Create GitHub Release
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          set -Eeuo pipefail
          gh release create "$RELEASE_TAG" release-assets/* \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --notes "FFmpeg ${FFMPEG_VERSION} sidecar release.

          Build: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          Commit: ${GITHUB_SHA}"
